name: LokiTunes Android Build & Release

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_RELEASE_KEY: ${{ secrets.LOKITUNES_KEYSTORE_BASE64 != '' && secrets.LOKITUNES_KEYSTORE_PASSWORD != '' && secrets.LOKITUNES_KEY_ALIAS != '' && secrets.LOKITUNES_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK without removed legacy tools package
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - name: Verify SDK and install Android 36
        shell: bash
        run: |
          sdkmanager --version
          sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and compile debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      - name: Verify tag and require signing secrets for official releases
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          if [ "$HAS_RELEASE_KEY" != 'true' ]; then
            echo 'Missing one or more LOKITUNES_* signing secrets. Refusing to publish an unsigned release.' >&2
            exit 1
          fi
          expected="${GITHUB_REF_NAME#v}"
          actual=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          if [ "$expected" != "$actual" ]; then
            echo "Tag $GITHUB_REF_NAME does not match app versionName $actual" >&2
            exit 1
          fi

      - name: Decode private release signing key
        if: ${{ env.HAS_RELEASE_KEY == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        env:
          LOKITUNES_KEYSTORE_BASE64: ${{ secrets.LOKITUNES_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LOKITUNES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lokitunes-release.jks"
          test -s "$RUNNER_TEMP/lokitunes-release.jks"

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' && github.event_name != 'pull_request' }}
        env:
          LOKITUNES_KEYSTORE_FILE: ${{ runner.temp }}/lokitunes-release.jks
          LOKITUNES_KEYSTORE_PASSWORD: ${{ secrets.LOKITUNES_KEYSTORE_PASSWORD }}
          LOKITUNES_KEY_ALIAS: ${{ secrets.LOKITUNES_KEY_ALIAS }}
          LOKITUNES_KEY_PASSWORD: ${{ secrets.LOKITUNES_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Verify signed APK certificate
        if: ${{ env.HAS_RELEASE_KEY == 'true' && github.event_name != 'pull_request' }}
        shell: bash
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose \
            --print-certs app/build/outputs/apk/release/app-release.apk

      - name: Upload debug APK (development only)
        uses: actions/upload-artifact@v4
        with:
          name: LokiTunes-dev-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload signed update-compatible APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' && github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: LokiTunes-signed-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish signed public GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download signed APK from the successful build
        uses: actions/download-artifact@v4
        with:
          name: LokiTunes-signed-release-apk
          path: release

      - name: Publish APK with predictable filename for in-app updater
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          test -s release/app-release.apk
          cp release/app-release.apk "release/LokiTunes-${GITHUB_REF_NAME}-release.apk"
          gh release create "$GITHUB_REF_NAME" \
            "release/LokiTunes-${GITHUB_REF_NAME}-release.apk" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "LokiTunes $GITHUB_REF_NAME" \
            --generate-notes
