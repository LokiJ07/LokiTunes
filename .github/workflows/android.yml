name: LokiTunes Android Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HAS_RELEASE_KEY: ${{ secrets.LOKITUNES_KEYSTORE_BASE64 != '' && secrets.LOKITUNES_KEYSTORE_PASSWORD != '' && secrets.LOKITUNES_KEY_ALIAS != '' && secrets.LOKITUNES_KEY_PASSWORD != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 36
        run: sdkmanager --install 'platforms;android-36' 'build-tools;36.0.0'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Run unit tests and compile debug APK
        run: gradle --no-daemon :app:testDebugUnitTest :app:assembleDebug

      # Optional: one stable release keystore stored in GitHub Secrets.
      # Never commit your keystore or passwords to the public repository.
      - name: Prepare stable release signing
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          LOKITUNES_KEYSTORE_BASE64: ${{ secrets.LOKITUNES_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LOKITUNES_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/lokitunes-release.jks"

      - name: Build signed release APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        env:
          LOKITUNES_KEYSTORE_FILE: ${{ runner.temp }}/lokitunes-release.jks
          LOKITUNES_KEYSTORE_PASSWORD: ${{ secrets.LOKITUNES_KEYSTORE_PASSWORD }}
          LOKITUNES_KEY_ALIAS: ${{ secrets.LOKITUNES_KEY_ALIAS }}
          LOKITUNES_KEY_PASSWORD: ${{ secrets.LOKITUNES_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Upload signed update-compatible APK
        if: ${{ env.HAS_RELEASE_KEY == 'true' }}
        uses: actions/upload-artifact@v4
        with:
          name: LokiTunes-v0.1.0-signed-release
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: LokiTunes-v0.1.0-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
